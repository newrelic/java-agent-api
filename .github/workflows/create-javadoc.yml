name: Javadoc

# Permissions granted to all jobs in the workflow.
# Permissions that aren't explicitly defined here will default to a value of none.
permissions:
  contents: write
  pull-requests: write

env:
  JAVADOC_TOKEN: ${{ secrets.JAVADOC_BOT_PAT }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  EMAIL: ${{ secrets.EMAIL }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'This is the version for the javadoc to be created'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # - uses: GitHubSecurityLab/actions-permissions/monitor@v1 # detects minimum permissions required to run the workflow, uncomment to use
      - name: Set Up Java 8
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # pin@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set Up Java 11
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # pin@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set Up Java 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # pin@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout agent
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # pin@v4
        with:
          repository: newrelic/newrelic-java-agent
          ref: v${{ inputs.version }}
          path: newrelic-java-agent

      - name: Set gradle.properties
        run: |
          cd ${GITHUB_WORKSPACE}/newrelic-java-agent
          sed -i -e "s|jdk8=8|jdk8=${JAVA_HOME_8_x64}|
          s|jdk11=11|jdk11=${JAVA_HOME_11_x64}|
          s|jdk17=17|jdk17=${JAVA_HOME_17_x64}|" gradle.properties.gha
          cat gradle.properties.gha >> gradle.properties

      - name: Setup Gradle Options
        run: echo "GRADLE_OPTIONS=-Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_x64,JAVA_HOME_11_x64,JAVA_HOME_8_x64" >> $GITHUB_ENV

      - name: Create Javadoc
        run: |
          cd ${GITHUB_WORKSPACE}/newrelic-java-agent/newrelic-api 
          ../gradlew javadoc $GRADLE_OPTIONS -Prelease=true -PagentVersion=${{ inputs.version }}

      - name: Checkout api/javadoc
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # pin@v4
        with:
          ref: gh-pages
          path: java-agent-api

      - name: Update contents and push api/javadoc
        run: |
          git config --global user.email ${{ env.EMAIL }}
          git config --global user.name "newrelic-java-agent-team"
          cd ${GITHUB_WORKSPACE}
          rm -r java-agent-api/javadoc
          mv newrelic-java-agent/newrelic-api/build/docs/javadoc java-agent-api
          cd java-agent-api
          git add javadoc
          git commit -m 'Updating to v${{ inputs.version }}'
          git push origin gh-pages:v${{ inputs.version }}
          gh pr create -B gh-pages -H v${{ inputs.version }} --title 'Merging v${{ inputs.version }} of javadocs' --body 'Merging v${{ inputs.version }} of javadocs'
